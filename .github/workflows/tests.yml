name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Compile check (all workbench python)
        run: |
          python -m py_compile run_panel.py panel/*.py conversion/*.py compat/*.py poc/*.py
      - name: Converter tests (skipped automatically if POC data absent)
        run: python tests/test_converters.py -v
